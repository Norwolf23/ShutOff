name: ShutOff
options:
  bundleIdPrefix: studio.nickson
  deploymentTarget:
    macOS: "13.0"
targets:
  ShutOff:
    type: application
    platform: macOS
    sources: [Sources, Assets.xcassets]
    entitlements:
      path: ShutOff.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events: [com.apple.systemevents]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.shutoff
      DEVELOPMENT_TEAM: 6272CRNH9G
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: 1
      INFOPLIST_FILE: Info.plist
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_APP_SANDBOX: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
  ShutOff-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources, Assets-iOS.xcassets]
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: ShutOff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_NAME: ShutOff
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.shutoff
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
