name: ShutOff
options:
  bundleIdPrefix: studio.nickson
  deploymentTarget:
    macOS: "13.0"
targets:
  ShutOff:
    type: application
    platform: macOS
    sources: [Sources, Assets.xcassets]
    entitlements:
      path: ShutOff.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events: [com.apple.systemevents]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ShutOff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        NSAppleEventsUsageDescription: ShutOff asks System Events to put the Mac to sleep when the timer ends.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.shutoff
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
  ShutOff-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources, Assets-iOS.xcassets, Widgets/CountdownAttributes.swift]
    dependencies:
      - target: ShutOffWidgets
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: ShutOff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_NAME: ShutOff
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.shutoff
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
  ShutOffWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ShutOff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.shutoff.widgets
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
