name: ShutOff
options:
  bundleIdPrefix: studio.nickson
  deploymentTarget:
    macOS: "13.0"
targets:
  ShutOff:
    type: application
    platform: macOS
    sources: [main.swift, Assets.xcassets]
    entitlements:
      path: ShutOff.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events: [com.apple.systemevents]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.shutoff
      DEVELOPMENT_TEAM: 6272CRNH9G
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: 1
      INFOPLIST_FILE: Info.plist
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_APP_SANDBOX: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      OTHER_SWIFT_FLAGS: -parse-as-library
